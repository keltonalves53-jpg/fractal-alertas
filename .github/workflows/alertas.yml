name: Fractal alertas
on:
  schedule:
    - cron: "3,8,13,18,23,28,33,38,43,48,53,58 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: fractal
  cancel-in-progress: false
jobs:
  rodar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Rodar varredura
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SYMBOLS: "BTCUSDT,ETHUSDT"
        run: python fractal_model.py --once
      - name: Salvar estado
        run: |
          git config user.name "alertas-bot"
          git config user.email "alertas-bot@users.noreply.github.com"
          git add alertas_enviados.json
          git diff --staged --quiet || (git commit -m "estado dos alertas" && git push)
